<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html">My Website</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="feedback.html">Feedback</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="photos.html">Photos</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <section class="highlight">
            <h2 id="feedback-title">Feedback Form</h2>
            <form>
                <label for="fullname">Full Name:</label><br>
                <input type="text" id="fullname" name="fullname"
                       placeholder="Enter your full name"
                       required minlength="3"><br><br>

                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email"
                       required><br><br>

                <p>How satisfied are you?</p>
                <input type="radio" id="verysatisfied" name="rating" value="Very Satisfied" required>
                <label for="verysatisfied">Very Satisfied</label><br>

                <input type="radio" id="satisfied" name="rating" value="Satisfied">
                <label for="satisfied">Satisfied</label><br>

                <input type="radio" id="neutral" name="rating" value="Neutral">
                <label for="neutral">Neutral</label><br>

                <input type="radio" id="unsatisfied" name="rating" value="Unsatisfied">
                <label for="unsatisfied">Unsatisfied</label><br><br>

                <p>Select Your Interests:</p>
                <input type="checkbox" id="webdev" name="interest" value="Web Development">
                <label for="webdev">Web Development</label><br>

                <input type="checkbox" id="mobiledev" name="interest" value="Mobile Development">
                <label for="mobiledev">Mobile Development</label><br>

                <input type="checkbox" id="ai" name="interest" value="AI & Machine Learning">
                <label for="ai">AI & Machine Learning</label><br><br>

                <label for="country">Select Your Country:</label><br>
                <select id="country" name="country" required>
                    <option value="">--Choose Country--</option>
                    <option value="Nepal">Nepal</option>
                    <option value="India">India</option>
                    <option value="USA">USA</option>
                </select><br><br>

                <label for="feedback">Write your <span class="accent-text">feedback</span> here:</label><br>
                <textarea id="feedback" name="feedback"
                          rows="5" cols="40"
                          placeholder="Enter your feedback"
                          required maxlength="300"></textarea><br><br>

                <button type="submit">Submit</button>
            </form>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
