        <!-- Flexbox Gallery Section -->
        <section class="gallery-section">
            <h2 class="text-center mb-4">Flexbox Gallery</h2>
            <div class="flexbox-gallery">
                <div class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=400&h=300&fit=crop" alt="Mountain landscape">
                    <p class="image-caption">Mountain Landscape</p>
                </div>
                <div class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=400&h=300&fit=crop" alt="Forest trees">
                    <p class="image-caption">Forest Trees</p>
                </div>
                <div class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=400&h=300&fit=crop" alt="Ocean waves">
                    <p class="image-caption">Ocean Waves</p>

                <div class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=400&h=300&fit=crop" alt="Sunset sky">

            </div>
        </section>

        <section class="gallery-section">
            <h2 class="text-center mb-4">Grid Gallery</h2>
            <div class="grid-gallery">
                <div class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400&h=300&fit=crop" alt="Beach sunset">
                    <p class="image-caption">Beach Sunset</p>
                </div>
                <div class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400&h=300&fit=crop" alt="Summer vibes">
