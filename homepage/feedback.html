<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
</head>
<body>

    <h2>Feedback Form</h2>

    <form>

        <!-- Full Name -->
        <label for="fullname">Full Name:</label><br>
        <input type="text" id="fullname" name="fullname"
               placeholder="Enter your full name"
               required minlength="3"><br><br>

        <!-- Email Address -->
        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email"
               placeholder="Enter your email"
               required><br><br>

        <!-- Rating Section -->
        <p>How satisfied are you?</p>

        <input type="radio" id="verysatisfied" name="rating" value="Very Satisfied" required>
        <label for="verysatisfied">Very Satisfied</label><br>

        <input type="radio" id="satisfied" name="rating" value="Satisfied">
        <label for="satisfied">Satisfied</label><br>

        <input type="radio" id="neutral" name="rating" value="Neutral">
        <label for="neutral">Neutral</label><br>

        <input type="radio" id="unsatisfied" name="rating" value="Unsatisfied">
        <label for="unsatisfied">Unsatisfied</label><br><br>

        <!-- Interests Section -->
        <p>Select Your Interests:</p>

        <input type="checkbox" id="webdev" name="interest" value="Web Development">
        <label for="webdev">Web Development</label><br>

        <input type="checkbox" id="mobiledev" name="interest" value="Mobile Development">
        <label for="mobiledev">Mobile Development</label><br>

        <input type="checkbox" id="ai" name="interest" value="AI & Machine Learning">
        <label for="ai">AI & Machine Learning</label><br><br>

        <!-- Country Selection -->
        <label for="country">Select Your Country:</label><br>
        <select id="country" name="country" required>
            <option value="">--Choose Country--</option>
            <option value="Nepal">Nepal</option>
            <option value="India">India</option>
            <option value="USA">USA</option>
        </select><br><br>

        <!-- Feedback Message -->
        <label for="feedback">Write your feedback here:</label><br>
        <textarea id="feedback" name="feedback"
                  rows="5" cols="40"
                  placeholder="Enter your feedback"
                  required maxlength="300"></textarea><br><br>

        <!-- Submit Button -->
        <button type="submit">Submit</button>

    </form>

</body>
</html>
